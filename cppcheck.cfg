# cppcheck configuration for suprminer
# This file configures static analysis for the codebase

# Project name
project=suprminer

# Platform specification
platform=unix64

# C/C++ standard
std=c99
std=c++11

# Include paths
include=.
include=compat
include=compat/jansson
include=compat/curl-for-windows/include
include=compat/nvapi
include=compat/pthreads
include=compat/sys
include=Algo256
include=crypto
include=equi
include=heavy
include=JHA
include=lbry
include=lyra2
include=neoscrypt
include=quark
include=qubit
include=scrypt
include=sha256
include=sia
include=skunk
include=sph
include=tribus
include=x11
include=x13
include=x15
include=x16r
include=x17

# Defines
define=HAVE_CONFIG_H
define=_GNU_SOURCE
define=_FILE_OFFSET_BITS=64
define=WIN32
define=_WIN32
define=_CRT_SECURE_NO_WARNINGS
define=USE_WRAPNVML

# Enable checks
enable=warning
enable=style
enable=performance
enable=portability
enable=information

# Suppress specific checks
suppress=missingIncludeSystem
suppress=unmatchedSuppression
suppress=unusedFunction
suppress=unreadVariable
suppress=knownConditionTrueFalse
suppress=redundantAssignment
suppress=variableScope
suppress=constParameter
suppress=passedByValue
suppress=useStlAlgorithm
suppress=useInitializationList

# Inline suppression format
inline-suppr=true

# Force checking all files
force=true

# Quiet mode (only show errors)
quiet=true

# Maximum number of configurations to check
max-configs=10

# Number of threads
j=4

# Output format
output-format=text

# Error exit code
error-exitcode=1
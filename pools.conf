{
	"_comment1": "suprminer Multi-Pool Configuration Template",
	"_comment2": "Copy this file to pools.conf and customize for your setup",
	"_comment3": "NEVER commit real credentials to version control!",
	"_comment4": "This file demonstrates pool failover/rotation configuration",

	"pools": [
		{
			"name": "Primary Pool",
			"url": "stratum+tcp://pool1.example.com:3333",
			"user": "YOUR_WALLET_ADDRESS.WORKER1",
			"pass": "x",
			"max-diff": 0.0,
			"scantime": 10,
			"time-limit": 0,
			"disabled": false
		},
		{
			"name": "Failover Pool",
			"url": "stratum+tcp://pool2.example.com:3333",
			"user": "YOUR_WALLET_ADDRESS.WORKER2",
			"pass": "x",
			"max-diff": 0.0,
			"scantime": 10,
			"time-limit": 300,
			"disabled": false
		}
	],

	"algo": "x16r",

	"timeout": 60,
	"retries": -1,
	"failover-pause": 30,

	"api-bind": "127.0.0.1:4068",
	"api-remote": false,
	"api-allow": "127.0.0.1/24",

	"no-gbt": true,
	"no-longpoll": false,
	"no-stratum": false
}